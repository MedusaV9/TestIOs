name: SoooDreamy IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  logic-tests:
    name: Logic tests (Swift on Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run swift test
        run: swift test --package-path SoooDreamy/ios

  typecheck:
    name: Typecheck app & widgets (Linux SDK simulation)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck
        working-directory: SoooDreamy/ios
        run: scripts/typecheck/typecheck.sh
      - name: Upload typecheck logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-logs
          path: SoooDreamy/ios/.typecheck-build/*.log
          if-no-files-found: ignore

  build-ipa:
    name: Unsigned IPA (iOS 26, Xcode 26)
    needs: [logic-tests, typecheck]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Render app icons
        run: |
          swift SoooDreamy/ios/scripts/GenerateIcon.swift SoooDreamy/ios/SoooDreamy/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024.png classic
          for v in sunset midnight mint rose ocean gold lavender blossom; do
            swift SoooDreamy/ios/scripts/GenerateIcon.swift "SoooDreamy/ios/SoooDreamy/Resources/Assets.xcassets/AppIcon-$v.appiconset/icon_1024.png" "$v"
          done

      - name: Generate Xcode project
        working-directory: SoooDreamy/ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: SoooDreamy/ios
        shell: bash {0}
        run: |
          xcodebuild \
            -project SoooDreamy.xcodeproj \
            -scheme SoooDreamy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecat|\*\* BUILD"
          status=${PIPESTATUS[0]}
          echo "xcodebuild exit code: $status"
          exit $status

      - name: Show errors on failure
        if: failure()
        working-directory: SoooDreamy/ios
        run: grep -B 2 -A 6 "error:" xcodebuild.log | head -300 || true

      - name: Package IPA
        working-directory: SoooDreamy/ios
        run: |
          APP_DIR="build/Build/Products/Release-iphoneos/SoooDreamy.app"
          test -d "$APP_DIR"
          mkdir -p dist/Payload
          cp -R "$APP_DIR" dist/Payload/
          cd dist
          zip -qry SoooDreamy-unsigned.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoooDreamy-unsigned-ipa
          path: SoooDreamy/ios/dist/SoooDreamy-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: SoooDreamy/ios/xcodebuild.log
          if-no-files-found: ignore

  release-latest:
    name: Rolling prerelease (IPA download)
    needs: build-ipa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: SoooDreamy-unsigned-ipa
      - name: Update rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sooodreamy-latest
          name: "SoooDreamy — latest unsigned IPA"
          prerelease: true
          body: |
            Rolling unsigned build from `${{ github.sha }}`.
            Sideload with AltStore / SideStore / Sideloadly.
          files: SoooDreamy-unsigned.ipa

name: MonkeyMoney
options:
  bundleIdPrefix: de.monkeymoney
  # iOS 17 floor: SwiftUI Observation, ContentUnavailableView, phaseAnimator.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual

targets:
  MonkeyMoney:
    type: application
    platform: iOS
    sources:
      - path: Core
        excludes:
          - "**/*.md"
      - path: App
      - path: Resources/Web
        type: folder
        buildPhase: resources
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Content
        type: folder
        buildPhase: resources
      - path: Resources/Audio
        type: folder
        buildPhase: resources
      - path: Resources/Monkeys
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.monkeymoney.app
        PRODUCT_NAME: MonkeyMoney
        # 1 = iPhone, 2 = iPad — the app is the stage on iPad and the controller on iPhone.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIStatusBarHidden: YES
    info:
      path: Config/MonkeyMoney-Info.plist
      properties:
        CFBundleDisplayName: Monkey Money
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - Fonts/Outfit-Regular.ttf
          - Fonts/Outfit-Medium.ttf
          - Fonts/Outfit-SemiBold.ttf
          - Fonts/Outfit-Bold.ttf
          - Fonts/Outfit-ExtraBold.ttf
          - Fonts/Outfit-Black.ttf
          - Fonts/Poppins-Regular.ttf
          - Fonts/Poppins-Medium.ttf
          - Fonts/Poppins-SemiBold.ttf
          - Fonts/Poppins-Bold.ttf
        NSCameraUsageDescription: "Monkey Money scannt den QR-Code auf dem iPad, um dem Raum beizutreten."
        NSLocalNetworkUsageDescription: "Monkey Money verbindet die Handys der Mitspieler über dein WLAN mit dem iPad."
        NSBonjourServices:
          - _monkeymoney._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: de.monkeymoney.app
            CFBundleURLSchemes:
              - monkeymoney

schemes:
  MonkeyMoney:
    build:
      targets:
        MonkeyMoney: all
    run:
      config: Debug
    archive:
      config: Release
